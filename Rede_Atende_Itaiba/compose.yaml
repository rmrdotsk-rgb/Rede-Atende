services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rede_atende
      POSTGRES_USER: rede_atende
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente ou .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rede_atende -d rede_atende']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
